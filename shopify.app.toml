# Link this file to YOUR merchant-owned app with pnpm config:link.
client_id = ""
name = "Superfiliate Gifting Example"
application_url = "https://your-app.example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "write_draft_orders,read_orders,read_products,read_fulfillments"

[auth]
redirect_urls = ["https://your-app.example.com/auth/callback"]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["fulfillments/create", "fulfillments/update", "orders/cancelled"]
uri = "/webhooks/shopify"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"
